# /etc/nginx/sites-available/dav_web adresine kopyalayin, sonra:
#   sudo ln -s /etc/nginx/sites-available/dav_web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Basic auth parolasi: sudo sh -c 'printf "kullanici:%s\n" "$(openssl passwd -apr1 SIFRE)" > /etc/nginx/htpasswd_dav'
# (SSL ve certbot blokları canlı sunucuda ayrıca tutulur; bu dosyada yoktur.)

server {
    listen 80;
    server_name videoperfect.kelvinaydinlatma.com.tr;

    client_max_body_size 2048M;  # buyuk .dav dosyalari icin yukleme limiti

    location / {
        auth_basic "Video Perfect";
        auth_basic_user_file /etc/nginx/htpasswd_dav;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
