# /etc/nginx/sites-available/dav_web adresine kopyalayin, sonra:
#   sudo ln -s /etc/nginx/sites-available/dav_web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name videoperfect.kelvinaydinlatma.com.tr;

    client_max_body_size 2048M;  # buyuk .dav dosyalari icin yukleme limiti

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
